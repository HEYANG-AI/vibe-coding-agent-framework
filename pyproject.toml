[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-coding-agent-framework"
version = "1.0.0"
description = "A Python-based automation Agent framework for building scalable, observable intelligent task processing systems."
requires-python = ">=3.8"
dependencies = [
    "selenium>=4.0",
    "pyyaml>=6.0",
    "pytest>=7.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
